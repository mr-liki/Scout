<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCOUT Jobs — Every Job Board. One Search.</title>
  <meta name="description" content="Search LinkedIn, Indeed, Glassdoor and Wellfound in one place. Free, fast, no accounts." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===================== NAV ===================== -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a href="#/" class="brand" data-route="/">
        <span class="brand-mark">⚡</span>
        <span class="brand-text">SCOUT<span class="brand-accent">JOBS</span></span>
      </a>
      <nav class="nav-links">
        <a href="#/" data-route="/" class="nav-link active">Search</a>
        <a href="#/saved" data-route="/saved" class="nav-link">Saved <span class="nav-badge" id="savedCount" hidden>0</span></a>
        <a href="#/about" data-route="/about" class="nav-link">How it works</a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
        <a class="btn btn-primary btn-sm" href="#/about" data-route="/about">Get started</a>
      </div>
    </div>
  </header>

  <!-- ===================== DEMO BANNER ===================== -->
  <div class="demo-banner" id="demoBanner" hidden>
    <span>⚙️ <strong>Demo mode</strong> — live search API not reachable. Showing sample results.</span>
    <button id="demoDismiss">×</button>
  </div>

  <main id="app"></main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-mark">⚡</span> SCOUT JOBS
        <p class="footer-tag">Every job board. One search. Free forever.</p>
      </div>
      <div class="footer-platforms">
        <span class="footer-label">Platforms</span>
        <span class="plat-pill li">LinkedIn</span>
        <span class="plat-pill in">Indeed</span>
        <span class="plat-pill gd">Glassdoor</span>
        <span class="plat-pill wf">Wellfound</span>
      </div>
      <p class="footer-note">Jobs are fetched from public, no-key sources. Apply on the source site.</p>
    </div>
  </footer>

  <!-- Modal root for job detail -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
